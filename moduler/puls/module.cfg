# PULS: BLONDA PULS, trummaskin med åtta syntade trumljud och 16-stegssekvenser (victorysvensson-dev/blonda-fm1, moduler/puls)
name = PULS
version = 1
sources = src/puls_fm1.c ../../gemensamt/effekter/sliten_fm1.c
includes = src ../../gemensamt ../../gemensamt/effekter
