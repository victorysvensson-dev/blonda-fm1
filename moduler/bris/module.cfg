# BRIS: BLONDA BRIS, sexstämmig analog poly efter GS Music Bree6 (victorysvensson-dev/blonda-fm1, moduler/bris)
name = BRIS
version = 1
sources = src/bris_fm1.c
includes = src
# FPU:n, som fm1-base och AMB-1 bygger: single precision float i de vanliga registren (inget mer att spara i
# ljudavbrottet). Inga double: chipet har bara single precision.
cflags = -mcpu=r3 -mfprev1 -ffp-contract=off
