# ONE: BLONDA ONE, en synth med två ljudmotorer (trioscillatormotorn och BRIS), ARP, SEQ, reverb, pump och ERA (victorysvensson-dev/blonda-fm1, moduler/one)
name = ONE
version = 7
sources = src/one_fm1.c src/bris_fm1.c src/bfx_fm1.c src/spel_fm1.c ../../gemensamt/effekter/sliten_fm1.c ../../gemensamt/effekter/rum_fm1.c ../../gemensamt/effekter/pump_fm1.c
includes = src ../../gemensamt ../../gemensamt/effekter
# FPU:n, som fm1-base och AMB-1 bygger: single precision float i de vanliga registren (inget mer att spara i
# ljudavbrottet). Inga double: chipet har bara single precision.
cflags = -mcpu=r3 -mfprev1 -ffp-contract=off
