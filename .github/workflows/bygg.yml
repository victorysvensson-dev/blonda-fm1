# Bygger alla moduler i moduler/ till .dock för FM-1 på GitHubs servrar, där JieLis kompilator kan hämtas,
# kör varje modul i fm1-emu med sex toner för att mäta lasten i ljudavbrottet, och bygger webbemulatorn.
# Varje körning lämnar filerna som artefakt; en tagg (v*) gör ett släpp av .dock-filerna.
name: bygg
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FM1_DOCK_REF: 94f8087ab62ea6c762cbb34747c8a01f02141a80   # joakimeriksson/fm1-dock, provad med
  FM1_EMU_REF: 95343aa3b05fcbf443f553ef140e7bcd216ec264    # joakimeriksson/fm1-emu, provad med

jobs:
  bygg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: blonda-fm1 }
      - uses: actions/checkout@v4
        with: { repository: joakimeriksson/fm1-dock, ref: '${{ env.FM1_DOCK_REF }}', path: fm1-dock }

      - name: Modulerna i en låtsas-FM-1 (på datorn)
        run: |
          for m in blonda-fm1/moduler/*/; do
            n=$(basename "$m")
            if [ -f "$m/test/modul_host.c" ]; then
              (cd "$m" && mkdir -p build/skarm \
                && SRCS=$(sed -n 's/^sources = //p' module.cfg) \
                && INCS=$(sed -n 's/^includes = //p' module.cfg | tr ' ' '\n' | sed 's/^/-I/' | tr '\n' ' ') \
                && for f in $SRCS; do cc -std=c99 -O2 -Wall -Wextra -Werror -Wdouble-promotion -Wfloat-conversion $INCS -c "$f" -o /dev/null; done \
                && cc -std=gnu99 -O2 -Wall -Wno-unused-function -I"$GITHUB_WORKSPACE/fm1-dock/firmware/dock" \
                   -I"$GITHUB_WORKSPACE/fm1-dock/firmware/src" -I"$GITHUB_WORKSPACE/fm1-dock/firmware/gen" $INCS \
                   test/modul_host.c ${n}_module.c $SRCS -o build/modul -lm \
                && build/modul build/skarm/s)
            fi
          done

      - name: JieLis kompilator (pi32v2)
        run: |
          pip3 install --break-system-packages Pillow mido python-rtmidi
          sh fm1-dock/tools/get_toolchain.sh

      - name: Bygg .dock för varje modul
        run: |
          mkdir -p ut
          cd fm1-dock
          for m in ../blonda-fm1/moduler/*/; do
            n=$(basename "$m")
            JIELI_TOOLCHAIN=$HOME/.jieli/toolchain python3 tools/hbmod.py "$m"
            python3 tools/hbmod.py --info "build/modules/$n.dock" | tee "../ut/$n-info.txt"
            cp "build/modules/$n.dock" ../ut/
          done

      - name: Mät lasten i fm1-emu (sex toner, ERA på TAPE)   # modulen skickas in över MIDI, sedan CC 77 och tonerna
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libasound2-dev pkg-config >/dev/null
          git clone --depth 1 https://github.com/joakimeriksson/fm1-emu.git fm1-emu
          git -C fm1-emu fetch --depth 1 origin "$FM1_EMU_REF" && git -C fm1-emu checkout "$FM1_EMU_REF"
          cargo build --release --manifest-path fm1-emu/Cargo.toml -p fm1-live
          cd fm1-dock
          for d in ../ut/*.dock; do
            n=$(basename "$d" .dock)
            # när modulen har skickats in (beror på storleken): ERA på TAPE 2 s efter, tonerna 3 s efter, mät 8 s
            done=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import hbdeploy; print(int(hbdeploy.din_script(open('$d','rb').read(), 1000)[1]))")
            t_cc=$((done + 2000)); t_on=$((done + 3000)); t_end=$((done + 11000))
            echo "== $n: inskickad vid $done ms, toner vid $t_on ms"
            keys="$t_cc:mB04D3C"; for nt in 30 37 3c 40 43 48; do keys="$keys,$t_on:m90${nt}64"; done
            FM1_LIVE=$GITHUB_WORKSPACE/fm1-emu/target/release/fm1-live python3 tools/dock.py emu --fwsc docs/fm1-dock-0.7.fwsc \
              --deploy "$d" --ms "$t_end" --keys "$keys" \
              --out "../ut/emu-$n" | tee "../ut/$n-last.txt"
            echo "== $n: fm1-dock:s logg och last"
            cat "../ut/emu-$n/log.txt" | tee -a "../ut/$n-last.txt"
            grep -E "render: " "../ut/emu-$n/log.txt" >> "$GITHUB_STEP_SUMMARY" || true
            ls "../ut/emu-$n"
            for f in screen.png panel.png; do
              if [ -f "../ut/emu-$n/$f" ]; then echo "BILD $f $(base64 -w0 "../ut/emu-$n/$f")"; break; fi
            done
            # ljudet: tyst innan tonerna, hörs efter
            python3 - "../ut/emu-$n/audio.wav" "$t_on" <<'PY'
          import sys, wave, array
          w = wave.open(sys.argv[1]); sr = w.getframerate(); a = array.array("h", w.readframes(w.getnframes()))
          on = int(sys.argv[2]) / 1000
          def peak(t0, t1): return max((abs(x) for x in a[int(t0 * sr) * 2:int(t1 * sr) * 2]), default=0)
          före, efter = peak(on - 2.5, on - 0.2), peak(on + 1, on + 7.5)
          print(f"ljud i fm1-emu: topp före tonerna {före}, med sex toner {efter} (av 32767)")
          sys.exit(0 if efter > 1000 else "inget ljud från modulen i fm1-emu")
          PY
            # under hälften av ljudavbrottet, som fm1-dock rekommenderar
            python3 - "../ut/emu-$n/log.txt" <<'PY'
          import re, sys
          t = open(sys.argv[1]).read()
          m = re.search(r"worst \d+ \(([\d.]+) %\), (\d+) overruns", t)
          if not m: sys.exit("ingen lastmätning i loggen")
          worst, over = float(m.group(1)), int(m.group(2))
          c1 = re.search(r"second core: (.*?); a job: last \d+ ticks \(([\d.]+) %\), worst \d+ \(([\d.]+) %\)", t)
          c1w = float(c1.group(3)) if c1 else 0.0
          print(f"kärna 0: värst {worst} % av ljudavbrottet, {over} överskridanden"
                + (f"; kärna 1 ({c1.group(1)}): värst {c1w} %" if c1 else "; kärna 1: inte i loggen"))
          sys.exit(1 if worst > 50 or c1w > 50 or over else 0)
          PY
          done

      - name: Webbsidan med fm1-emu (riktig FM-1-emulator med fm1-dock och modulerna installerade)
        run: |
          rustup target add wasm32-unknown-unknown
          bash fm1-emu/web/build.sh "$GITHUB_WORKSPACE/sida/fm1-emu" >/dev/null
          cd fm1-dock
          python3 - "$GITHUB_WORKSPACE/sida/fm1-emu" ../ut/*.dock <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import hbmod, tryit
          out = Path(sys.argv[1])
          for d in sys.argv[2:]:
              blob = Path(d).read_bytes()
              n = Path(d).stem
              (out / f"{n}.flash").write_bytes(tryit.sector_file(tryit.sectors_for(blob)))
              (out / f"{n}.txt").write_text(tryit.script(hbmod.parse(blob)[0]["name"]))
              print(n, "->", f"fm1-emu/?fw=fm1dock&flash={n}.flash&script={n}.txt")
          PY
          cd "$GITHUB_WORKSPACE/sida"
          cat > index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>BLONDA FM-1</title>
          <meta http-equiv="refresh" content="0; url=fm1-emu/?fw=fm1dock&flash=bris.flash&script=bris.txt">
          <p><a href="fm1-emu/?fw=fm1dock&flash=bris.flash&script=bris.txt">BRIS på FM-1 (fm1-emu)</a></p>
          HTML
          ls -la "$GITHUB_WORKSPACE/sida" "$GITHUB_WORKSPACE/sida/fm1-emu" | head -40

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: sida }

      - name: Webbemulatorn
        run: |
          sudo apt-get install -y -qq lld >/dev/null
          FM1_DOCK=$GITHUB_WORKSPACE/fm1-dock sh blonda-fm1/web/bygg.sh
          cp blonda-fm1/web/index.html ut/emulator.html

      - uses: actions/upload-artifact@v4
        with:
          name: blonda-fm1
          path: |
            ut/
            blonda-fm1/moduler/*/build/skarm/*.ppm

      - name: Släpp (bara för taggar)
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "$GITHUB_REF_NAME" ut/*.dock ut/emulator.html --repo "$GITHUB_REPOSITORY" \
            --title "BLONDA FM-1 $GITHUB_REF_NAME" --notes "BLONDAs moduler för M-VAVE FM-1 (fm1-dock). Webbemulatorn finns i emulator.html."

  # GitHub Pages: fm1-emu med BRIS på https://victorysvensson-dev.github.io/blonda-fm1/
  # (kräver att Pages är påslaget med källan "GitHub Actions" i repots inställningar)
  sida:
    needs: bygg
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
